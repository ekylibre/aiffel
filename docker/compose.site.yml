# Site vitrine Aiffel (aiffel.org et www.aiffel.org) pour Dokploy.
#
# Application Compose séparée de la stack applicative (compose.dokploy.yml) : le site se
# redéploie sans toucher à app.aiffel.org. Un seul service nginx, sans état ni secret.
#
# Domaines à déclarer dans Dokploy (onglet « Domains », service ``site``, port 8080, HTTPS) :
#   - aiffel.org
#   - www.aiffel.org (nginx le redirige vers aiffel.org)
# Voir docs/ops/dokploy.md, section « Site vitrine ».

name: aiffel-site

services:
  site:
    image: ${AIFFEL_SITE_IMAGE:-aiffel-site:local}
    build:
      context: ../site
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
