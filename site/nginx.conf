# Site vitrine aiffel.org, servi derrière Traefik (Dokploy) qui termine le TLS.
# www.aiffel.org redirige vers aiffel.org ; tout autre nom (healthcheck interne) sert le site.

server_tokens off;

map $sent_http_content_type $cache_control {
    default                 "no-cache";
    ~^text/css              "public, max-age=604800";
    ~^font/                 "public, max-age=31536000, immutable";
    ~^image/                "public, max-age=604800";
}

server {
    listen 8080;
    server_name www.aiffel.org;
    return 301 https://aiffel.org$request_uri;
}

server {
    listen 8080 default_server;
    server_name aiffel.org;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css image/svg+xml text/plain;
    gzip_min_length 512;

    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Aucun script, aucune ressource tierce : la page n'en a pas besoin.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
